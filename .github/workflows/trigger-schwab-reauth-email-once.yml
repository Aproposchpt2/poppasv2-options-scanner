name: Trigger Schwab Reauthorization Email Once

on:
  push:
    paths:
      - '.github/workflows/trigger-schwab-reauth-email-once.yml'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call production recovery endpoint
        run: |
          python - <<'PY'
          import urllib.request
          url = 'https://poppasv2.ai4academy.net/.netlify/functions/schwab-reauth-email?send=1'
          req = urllib.request.Request(url, headers={'Accept': 'application/json'})
          with urllib.request.urlopen(req, timeout=60) as response:
              body = response.read().decode('utf-8', 'replace')
              print(body)
              if response.status >= 400:
                  raise SystemExit(response.status)
          PY
