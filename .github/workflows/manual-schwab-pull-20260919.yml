name: Manual Schwab Pull 2026-09-19

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manual-schwab-pull:
    if: contains(github.event.head_commit.message, '[RUN-MANUAL-SCHWAB-PULL-20260919]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger production Schwab pull
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X POST             'https://poppasv2.ai4academy.net/.netlify/functions/schwab-morning-pull-task?source=manual-20260919'             | tee /tmp/trigger.json
          echo
          jq . /tmp/trigger.json
          jq -e '.ok == true' /tmp/trigger.json >/dev/null
